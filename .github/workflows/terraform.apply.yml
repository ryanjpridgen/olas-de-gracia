name: "Terraform Apply"

on:
  push:
    branches:
      - development
      - staging
      - main

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
  TF_CLOUD_ORGANIZATION: "${{ secrets.TF_ORG }}"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.env.ENVIRONMENT }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        env:
          TF_WORKSPACE: "web-${{ env.ENVIRONMENT }}"
        run: terraform init

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: apply-upload
        with:
          workspace: "web-${{ env.ENVIRONMENT }}"
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: apply-run
        with:
          workspace: "web-${{ env.ENVIRONMENT }}"
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.0.0
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"

      - name: Get D1 database ID
        id: d1
        env:
          TF_WORKSPACE: "web-${{ env.ENVIRONMENT }}"
        run: |
          D1_DATABASE_ID=$(terraform output -raw database_id)
          echo "database_id=$D1_DATABASE_ID" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          jq \
            --arg env "$ENVIRONMENT" \
            --arg id "$D1_DATABASE_ID" \
            '.d1_databases[0].database_id = $id |
             .d1_databases[0].database_name = ("odg-" + $env)' \
            wrangler.template.json > wrangler.json

      - name: Apply SQL Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm wrangler d1 migrations apply odg-$ENVIRONMENT --remote --config wrangler.json

      - name: Build
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: pnpm build

      - name: Deploy
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: pnpm deploy

