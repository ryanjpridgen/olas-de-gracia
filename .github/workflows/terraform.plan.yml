name: "Terraform Plan"

on:
  pull_request:
    branches:
      - development
      - staging
      - main

env:
  ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'staging' && 'staging' || 'development' }}
  TF_CLOUD_ORGANIZATION: "${{ secrets.TF_ORG }}"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.env.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v3

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - uses: pnpm/action-setup@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Prettier
        run: pnpm format --check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  plan:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.env.ENVIRONMENT }}
    steps:
      - name: Terraform Config Upload
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: upload
        env:
          TF_WORKSPACE: "web-${{ env.ENVIRONMENT }}"
        with:
          token: ${{ env.TF_API_TOKEN }}
          organization: ${{ env.TF_CLOUD_ORGANIZATION }}
          workspace: "web-${{ env.ENVIRONMENT }}"
          directory: ./
          speculative: true

      - name: Terraform Plan
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: run
        with:
          workspace: "web-${{ job.environment }}"
          configuration_version: ${{ steps.upload.outputs.configuration_version_id }}
          plan_only: true
          message: "Github ${{ github.ref_name }}@${{ github.sha }}"

      - uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        with:
          plan: ${{ steps.run.outputs.plan_id }}
